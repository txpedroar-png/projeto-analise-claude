; Copie para config_local.ini (fora do Git) e ajuste.
; Opcional (se o CNJ trocar a chave pública do DataJud), no Prompt de Comando:
;   setx DATAJUD_API_KEY "nova-chave"

[planilha_google]
; ID = trecho do link entre /d/ e /edit
id = COLE_AQUI_O_ID_DA_PLANILHA
; Arquivo JSON da conta de serviço. Guardar FORA da pasta do Google Drive e fora do repositório.
credencial = C:\robo\credencial-robo.json

[djen]
; Uma ou mais OABs, separadas por vírgula, no formato NUMERO/UF (todas as dos advogados do escritório).
oab = 29573/PB
uf = PB
; Dias para trás consultados a cada execução (a repetição não gera duplicata).
dias_busca = 15

; Robô antigo (planilha .xlsx local), mantido só como reserva:
[planilha]
caminho =
